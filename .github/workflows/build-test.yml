name: Build and test

# Builds the full Windows solution (neo.sln) and runs every test project in it.
# Trigger: pushes to main and pull requests that touch code, or manual dispatch.
#
# Why Windows only: neo.sln contains the WPF host and WPF plugin windows
# (net9.0-windows). The cross-platform slice (neo-avalonia.sln) is a strict
# subset of what gets built here.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore neo.sln

      - name: Build
        run: dotnet build neo.sln --configuration Release --no-restore --nologo

      # Category=UiSmoke (Neo.PluginWindow.SmokeTests) launches the real plugin window
      # executables and opens windows; those run locally with a plain `dotnet test`.
      - name: Test
        run: dotnet test neo.sln --configuration Release --no-build --nologo --filter "Category!=UiSmoke"
